# Sign2Sign — Dependabot config
# Closes R10 from docs/SECURITY_AUDIT_2026_06_01.md.
#
# Weekly is the right cadence for a low-velocity project: noisy enough to
# keep advisories visible, quiet enough to batch review. Patch + minor are
# auto-grouped so each weekly PR is small; majors fall out one-per-PR so
# breaking-change review stays focused.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        exclude-patterns:
          # react-native uses 0.x.y — a "minor" bump (e.g. 0.83 → 0.85) is a
          # de-facto major and must be peer-aligned with the Expo SDK. Keep it
          # in its own PR so it can be reviewed alongside an SDK bump.
          - "react-native"
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 3
