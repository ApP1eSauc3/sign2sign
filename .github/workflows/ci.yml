# Sign2Sign — CI
#
# Closes PT1 #20 from docs/LAUNCH_SECURITY_AUDIT_2026_08_18.md. Dependabot was
# already opening dependency PRs, but nothing ran the audit or the tests, so a
# regression only surfaced when someone happened to run them locally.
#
# Deliberately three cheap jobs rather than one: a failing audit should not hide
# a failing test run, and vice versa — you want to see both in one glance.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land after you merge, not before. A weekly run catches a
  # dependency that went bad while nothing in the repo changed.
  schedule:
    - cron: '0 0 * * 1'

jobs:
  test:
    name: Tests + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci, not npm install — installs exactly the committed lockfile.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Replays supabase/migrations into PGlite (Postgres 17 in WASM) and
      # checks grants/RLS as the API roles: the driver photo write (#12),
      # the security log, the IP throttle and MFA enforcement.
      - run: npm run test:migrations

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on any high/critical advisory not triaged in
      # scripts/audit-allowlist.json, or whose triage is past its reviewBy
      # date. It replaced a bare `npm audit --audit-level=high` on 2026-10-11:
      # that job failed on every run because of build-tool advisories, so it
      # was always red and a new, real advisory would not have stood out.
      - run: npm run audit:gate

  electron:
    name: Electron shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install needed — a syntax check on the Electron shell and its build hooks.
      - run: npm run verify:electron

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-checks every function (and the _shared modules they import), then
      # runs the shared unit tests: recent-auth, client IP, security events.
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions/_shared/
